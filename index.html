<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Instructor - SISAMEX</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #111; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; padding: 20px 0;}
        .sala-dark { background-color: #1a1a1a; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 95%; max-width: 900px; margin: auto; }
        
        .btn-action { color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .btn-action:hover { opacity: 0.8; }
        .btn-action:disabled { background-color: #555 !important; cursor: not-allowed; }
        
        .sala-input { padding: 15px; font-size: 18px; border-radius: 8px; border: 1px solid #333; text-align: center; width: 100%; max-width: 300px; margin-bottom: 20px; outline: none; background: #222; color: white; }
        
        .timer-gigante { font-size: 90px; font-weight: bold; color: #C8102E; margin: 0; font-family: monospace; }
        .curso-box { background: #222; padding: 20px; border-radius: 8px; border-left: 5px solid #0F9D58; text-align: left; }
        
        #custom-alert { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center; }
        .alert-box { background:white; padding:30px; border-radius:10px; max-width:450px; width: 90%; text-align:center; color: #111; }
        
        /* Layouts Flexbox */
        .flex-col { display: flex; flex-direction: column; gap: 20px; align-items: center; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: LOGIN -->
    <div class="sala-dark" id="sala-login">
        <h1 style="font-size: 32px; color: #0F9D58; margin-bottom: 10px;">🎓 Auditoría SISAMEX</h1>
        <p style="font-size: 16px; color: #aaa; margin-bottom: 30px;">Ingresa la clave de acceso de Instructor.</p>
        <input type="password" id="input-sala-pass" class="sala-input" placeholder="Contraseña">
        <br>
        <button class="btn-action" id="btn-login" style="background-color: #0F9D58;" onclick="verificarPassInstructor()">Ingresar</button>
    </div>

    <!-- PANTALLA 2: LISTA DE CURSOS -->
    <div class="sala-dark flex-col" id="sala-lista-cursos" style="display: none; max-width: 800px;">
        
        <div style="text-align: center; width: 100%;">
            <h1 style="font-size: 32px; margin-bottom: 5px; line-height: 1.2;">Cursos programados para hoy</h1>
            <p id="txt-fecha-hoy" style="color: #aaa; font-size: 16px; margin: 0;"></p>
        </div>
        
        <div id="contenedor-cursos-hoy" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
            <!-- Tarjetas de curso -->
        </div>

        <div style="width: 100%; text-align: center; margin-top: 15px;">
            <button class="btn-action" style="background-color: #444; width: 100%; max-width: 300px; font-size: 18px; padding: 15px;" onclick="location.reload()">Cerrar Sesión</button>
        </div>
    </div>

    <!-- PANTALLA 3: CURSO ACTIVO Y TEMPORIZADOR -->
    <div class="sala-dark flex-col" id="sala-activa" style="display: none; max-width: 700px;">
        <div class="curso-box" style="width: 100%;">
            <h3 style="color: #0F9D58; margin-bottom: 15px; font-size: 24px;" id="sala-curso-titulo"></h3>
            <p style="margin: 8px 0; color: #ddd; font-size: 16px;"><strong>Instructor:</strong> <span id="sala-curso-inst"></span></p>
            <p style="margin: 8px 0; color: #ddd; font-size: 16px;"><strong>Grupo:</strong> <span id="sala-curso-grupo"></span></p>
        </div>
        
        <div style="text-align: center; width: 100%; margin-top: 20px;">
            <p style="font-size: 20px; color: #aaa; margin-bottom: 10px;">Tiempo restante de sesión obligatoria:</p>
            <div class="timer-gigante" id="timer-display">00:00:00</div>
            <button class="btn-action" id="btn-pre-finalizar" style="background-color: #C8102E; font-size: 20px; padding: 15px 40px; display: none; margin-top: 20px; width: 100%;" onclick="prepararFirmaAuditoria()">Terminar Curso y Firmar</button>
        </div>
    </div>

    <!-- PANTALLA 4: EVIDENCIA, CÁMARA Y FIRMA -->
    <div class="sala-dark flex-col" id="sala-firma" style="display: none; max-width: 800px; padding: 40px;">
        
        <div style="text-align: center; width: 100%; margin-bottom: 20px;">
            <h2 style="color: #fff; margin-bottom: 5px; font-size: 32px;">✍️ Evidencia y Conformidad</h2>
            <p style="color: #aaa; font-size: 16px;">Permite el acceso a la cámara y dibuja tu firma para finalizar.</p>
        </div>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%;">
            <!-- Cámara Web -->
            <div style="background: #000; border-radius: 8px; overflow: hidden; width: 320px; height: 200px; position: relative; border: 2px solid #555;">
                <video id="videoCamara" width="320" height="200" autoplay muted playsinline style="object-fit: cover; width: 100%; height: 100%; display: none;"></video>
                <canvas id="canvasFotoCam" width="320" height="200" style="display:none; width: 100%; height: 100%; object-fit: cover;"></canvas>
                <div id="fallbackCamara" style="position: absolute; top: 40%; width: 100%; text-align: center; color:#aaa; font-size:14px; display:none;">Cámara apagada</div>
                
                <div style="position: absolute; bottom: 10px; width: 100%; text-align: center; z-index: 10;">
                    <button id="btn-tomar-foto" onclick="tomarFoto()" class="btn-action" style="background-color: #2B579A; padding: 8px 20px; font-size: 14px; display:none; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">📸 Capturar</button>
                    <button id="btn-retomar-foto" onclick="retomarFoto()" class="btn-action" style="background-color: #555; padding: 8px 20px; font-size: 14px; display:none; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">🔄 Retomar</button>
                </div>
            </div>
            
            <!-- Firma -->
            <div style="background: white; border-radius: 8px; overflow: hidden; width: 320px; height: 200px; position: relative;">
                <canvas id="canvasFirma" width="320" height="200" style="cursor: crosshair; touch-action: none; display: block;"></canvas>
                <div style="position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; color: #ccc; font-size: 12px; pointer-events: none;">Área de Firma</div>
            </div>
        </div>
        
        <div style="display: flex; gap: 20px; justify-content: center; width: 100%; margin-top: 30px; flex-wrap: wrap;">
            <button class="btn-action" style="background-color: #555; font-size: 18px; padding: 15px 40px; min-width: 200px;" onclick="limpiarFirma()">Borrar Firma</button>
            <button class="btn-action" id="btn-capturar-firma" style="background-color: #0F9D58; font-size: 18px; padding: 15px 40px; min-width: 200px;" onclick="guardarFirmaYEnviar()"><span id="txt-btn-enviar">✅ Confirmar y Enviar</span></button>
        </div>
    </div>

    <!-- Modal de Alertas -->
    <div id="custom-alert">
        <div class="alert-box">
            <h3 id="custom-alert-title" style="margin-top:0; font-size: 22px;">Mensaje</h3>
            <p id="custom-alert-msg" style="font-size:16px; margin: 15px 0;"></p>
            <button onclick="document.getElementById('custom-alert').style.display='none'" class="btn-action" style="background-color: #0F9D58; width: 100%;">Aceptar</button>
        </div>
    </div>

    <script>
        // =========================================================
        //  PEGAR AQUÍ LA URL DE TU SCRIPT DE GOOGLE 
        const API_URL = "https://script.google.com/macros/s/AKfycbwXi4Es2kt1ok_75jkI8DEl0Q91gbn7YfePJ-EhZxwA34iZrz23tsjQxhFQzTSKpJcE/exec"; 
        // =========================================================

        let datosGlobales = [];
        let cursosDeHoyLista = []; 
        let cursoAuditando = null; 
        let tiempoRestanteSegundos = 0; 
        let intervaloTimer = null; 
        
        let streamCamara = null;
        let fotoTomada = false;
        let canvasFirma, ctxFirma, dibujando = false, haFirmado = false;

        function mostrarAlerta(mensaje, titulo = "SISAMEX") {
            document.getElementById('custom-alert-title').innerText = titulo;
            document.getElementById('custom-alert-msg').innerText = mensaje;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function verificarPassInstructor() {
            let pass = document.getElementById('input-sala-pass').value;
            if (pass === "Sisamex2026") { 
                let btn = document.getElementById('btn-login');
                btn.innerText = "Conectando con Servidor SISAMEX... ⏳";
                btn.disabled = true;

                // ⚡ AQUÍ ESTÁ LA MAGIA ROMPE-CACHÉ: Le agregamos el milisegundo exacto al enlace
                let enlaceFresco = API_URL + "?action=api_cursos&nocache=" + new Date().getTime();

                fetch(enlaceFresco)
                    .then(response => response.json())
                    .then(data => {
                        datosGlobales = data.registros || [];
                        let datosPC = data.planCarreraRegistros || [];
                        
                        document.getElementById('sala-login').style.display = 'none'; 
                        document.getElementById('sala-lista-cursos').style.display = 'flex'; 
                        cargarCursosDelDia(datosPC);
                    })
                    .catch(err => {
                        mostrarAlerta("Error al conectar con la base de datos: " + err, "Error");
                        btn.innerText = "Ingresar";
                        btn.disabled = false;
                    });
            } else { 
                mostrarAlerta("La contraseña es incorrecta.", "Acceso Denegado"); 
            }
        }

        function cargarCursosDelDia(datosPC) {
            let hoyObj = new Date(); 
            let y = hoyObj.getFullYear(); 
            let m = (hoyObj.getMonth() + 1).toString().padStart(2, '0'); 
            let d = hoyObj.getDate().toString().padStart(2, '0');
            let fechaHoyStr = y + "-" + m + "-" + d;
            
            document.getElementById('txt-fecha-hoy').innerText = "Fecha: " + d + "/" + m + "/" + y;

            let cursosInduccion = datosGlobales.filter(c => c.fecha === fechaHoyStr && c.instructor !== "Por asignar" && !c.temaAgrupado.toUpperCase().includes("COMIDA"));
            let cursosPlanC = datosPC.filter(c => c.fechaA === fechaHoyStr && c.instructor !== "Por asignar");

            cursosDeHoyLista = [];
            cursosInduccion.forEach(c => cursosDeHoyLista.push({ tipo: "Inducción", idCurso: c.idCurso, curso: c.temaAgrupado, instructor: c.instructor, grupo: c.grupo, minutos: c.minutosAutorizados, horario: c.horaFiltro, fecha: c.fecha }));
            cursosPlanC.forEach(c => cursosDeHoyLista.push({ tipo: "Plan Carrera", idCurso: c.idCurso, curso: c.curso, instructor: c.instructor, grupo: "N/A", minutos: c.minutosAutorizados, horario: c.horario, fecha: c.fechaA }));

            let contenedor = document.getElementById('contenedor-cursos-hoy'); 
            contenedor.innerHTML = '';
            
            if (cursosDeHoyLista.length === 0) { 
                contenedor.innerHTML = '<p style="color: #fff; font-size: 18px;">No hay cursos programados para hoy.</p>'; 
                return; 
            }

            cursosDeHoyLista.forEach((curso, index) => {
                let m = curso.minutos; let textMin = m > 0 ? (m + " mins") : "Sin tiempo";
                let cardHTML = `<div class="curso-box" style="display:flex; justify-content:space-between; align-items:center;">
                    <div><h4 style="margin: 0 0 5px 0; color: #fff; font-size: 18px;">${curso.curso}</h4>
                    <p style="margin: 0; color: #aaa; font-size: 13px;"><strong>Instructor:</strong> ${curso.instructor} | <strong>Hora:</strong> ${curso.horario} | <strong>Duración:</strong> ${textMin}</p></div>
                    <button class="btn-action" style="background-color:#0F9D58; padding: 10px 20px;" onclick="iniciarSesionCurso(${index})">Iniciar</button>
                </div>`;
                contenedor.innerHTML += cardHTML;
            });
        }

        function iniciarSesionCurso(index) {
            cursoAuditando = cursosDeHoyLista[index];
            if (cursoAuditando.minutos <= 0) return mostrarAlerta("Este curso no tiene tiempo definido en catálogo.");

            document.getElementById('sala-lista-cursos').style.display = 'none'; 
            document.getElementById('sala-activa').style.display = 'flex';
            document.getElementById('sala-curso-titulo').innerText = cursoAuditando.curso; 
            document.getElementById('sala-curso-inst').innerText = cursoAuditando.instructor; 
            document.getElementById('sala-curso-grupo').innerText = cursoAuditando.grupo;

            tiempoRestanteSegundos = 10; 
            actualizarPantallaTimer();

            intervaloTimer = setInterval(() => {
                tiempoRestanteSegundos--; actualizarPantallaTimer();
                if (tiempoRestanteSegundos <= 0) { clearInterval(intervaloTimer); document.getElementById('btn-pre-finalizar').style.display = 'inline-block'; }
            }, 1000);
        }

        function actualizarPantallaTimer() {
            if (tiempoRestanteSegundos < 0) tiempoRestanteSegundos = 0;
            let h = Math.floor(tiempoRestanteSegundos / 3600); let m = Math.floor((tiempoRestanteSegundos % 3600) / 60); let s = tiempoRestanteSegundos % 60;
            document.getElementById('timer-display').innerText = (h > 0 ? h + ":" : "") + m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
        }

        function prepararFirmaAuditoria() {
            document.getElementById('sala-activa').style.display = 'none'; 
            document.getElementById('sala-firma').style.display = 'flex';
            
            canvasFirma = document.getElementById('canvasFirma'); 
            ctxFirma = canvasFirma.getContext('2d'); 
            limpiarFirma();

            function getPos(e) { 
                let rect = canvasFirma.getBoundingClientRect(); 
                let evt = e.touches ? e.touches[0] : e; 
                let scaleX = canvasFirma.width / rect.width; 
                let scaleY = canvasFirma.height / rect.height; 
                return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY }; 
            }

            canvasFirma.onmousedown = (e) => { dibujando = true; haFirmado = true; let pos = getPos(e); ctxFirma.beginPath(); ctxFirma.moveTo(pos.x, pos.y); };
            canvasFirma.onmousemove = (e) => { if (dibujando) { let pos = getPos(e); ctxFirma.lineTo(pos.x, pos.y); ctxFirma.stroke(); } };
            canvasFirma.onmouseup = () => { dibujando = false; ctxFirma.closePath(); };
            canvasFirma.onmouseleave = () => { dibujando = false; };
            canvasFirma.ontouchstart = (e) => { e.preventDefault(); dibujando = true; haFirmado = true; let pos = getPos(e); ctxFirma.beginPath(); ctxFirma.moveTo(pos.x, pos.y); };
            canvasFirma.ontouchmove = (e) => { e.preventDefault(); if (dibujando) { let pos = getPos(e); ctxFirma.lineTo(pos.x, pos.y); ctxFirma.stroke(); } };
            canvasFirma.ontouchend = (e) => { e.preventDefault(); dibujando = false; ctxFirma.closePath(); };

            if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(stream) {
                        streamCamara = stream;
                        var video = document.getElementById('videoCamara');
                        video.srcObject = stream;
                        video.play();
                        
                        video.style.display = 'block';
                        document.getElementById('canvasFotoCam').style.display = 'none';
                        document.getElementById('fallbackCamara').style.display = 'none';
                        
                        document.getElementById('btn-tomar-foto').style.display = 'inline-block';
                        document.getElementById('btn-retomar-foto').style.display = 'none';
                    })
                    .catch(function(err) {
                        console.warn("Cámara denegada: ", err);
                        document.getElementById('fallbackCamara').style.display = 'block';
                        document.getElementById('videoCamara').style.display = 'none';
                    });
            } else {
                document.getElementById('fallbackCamara').style.display = 'block';
            }
        }

        function tomarFoto() {
            var video = document.getElementById('videoCamara');
            var canvas = document.getElementById('canvasFotoCam');
            var ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            video.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('btn-tomar-foto').style.display = 'none';
            document.getElementById('btn-retomar-foto').style.display = 'inline-block';
            fotoTomada = true;
        }

        function retomarFoto() {
            document.getElementById('videoCamara').style.display = 'block';
            document.getElementById('canvasFotoCam').style.display = 'none';
            document.getElementById('btn-tomar-foto').style.display = 'inline-block';
            document.getElementById('btn-retomar-foto').style.display = 'none';
            fotoTomada = false;
        }

        function limpiarFirma() { 
            ctxFirma.globalCompositeOperation = "source-over"; 
            ctxFirma.fillStyle = "#FFFFFF"; 
            ctxFirma.fillRect(0, 0, canvasFirma.width, canvasFirma.height); 
            ctxFirma.strokeStyle = "#000000"; 
            ctxFirma.lineWidth = 3; 
            ctxFirma.lineCap = "round"; 
            haFirmado = false; 
        }

        function guardarFirmaYEnviar() {
            if(!haFirmado) return mostrarAlerta("Por favor, dibuja tu firma en el recuadro blanco.");
            if(!fotoTomada && streamCamara) return mostrarAlerta("Por favor, haz clic en 'Capturar Foto'.");

            let btnDiv = document.getElementById('btn-capturar-firma'); 
            let txtSpan = document.getElementById('txt-btn-enviar');
            txtSpan.innerHTML = "⏳ Enviando a Servidor..."; 
            btnDiv.style.pointerEvents = 'none';
            btnDiv.style.opacity = '0.5';
            
            let base64Firma = canvasFirma.toDataURL('image/jpeg', 0.9).split(',')[1];
            
            var base64Foto = "NO_CAMERA";
            if (fotoTomada) {
                var canvasFoto = document.getElementById('canvasFotoCam');
                base64Foto = canvasFoto.toDataURL('image/jpeg', 0.8).split(',')[1];
            }

            let ahora = new Date(); let horaFinTexto = ahora.getHours().toString().padStart(2, '0') + ":" + ahora.getMinutes().toString().padStart(2, '0');
            let nombreArchivoCorto = cursoAuditando.fecha.replace(/-/g, '') + "_" + cursoAuditando.instructor.split(" ")[0] + "_" + cursoAuditando.curso.substring(0, 10).replace(/\s/g, '');
            
            let paqueteAuditoria = { 
                idCurso: cursoAuditando.idCurso, curso: cursoAuditando.curso, instructor: cursoAuditando.instructor, 
                grupo: cursoAuditando.grupo, minutos: cursoAuditando.minutos, fecha: cursoAuditando.fecha, 
                horaFin: horaFinTexto, imagenBase64: base64Firma, fotoBase64: base64Foto, nombreArchivo: nombreArchivoCorto 
            };

            fetch(API_URL, {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "guardarAuditoria", paquete: paqueteAuditoria })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "OK") { 
                    mostrarAlerta("✅ Evidencia capturada y guardada en Drive/Excel exitosamente.", "Auditoría Exitosa"); 
                    setTimeout(() => location.reload(), 3000); 
                } else { 
                    mostrarAlerta(data.status, "Error de Apps Script"); 
                    txtSpan.innerHTML = "✅ Confirmar y Enviar"; 
                    btnDiv.style.pointerEvents = 'auto';
                    btnDiv.style.opacity = '1';
                }
            })
            .catch(err => { 
                mostrarAlerta("Fallo en la comunicación con el servidor: " + err, "Error Crítico"); 
                txtSpan.innerHTML = "✅ Confirmar y Enviar"; 
                btnDiv.style.pointerEvents = 'auto';
                btnDiv.style.opacity = '1';
            });
        }
    </script>
</body>
</html>
